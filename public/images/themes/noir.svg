  <text x="80" y="123" font-size="30" text-anchor="middle">🍣</text>
  <text x="130" y="105" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" letter-spacing="1">NOIR SUSHI LOUNGE</text>
  <text x="130" y="125" fill="#71717A" font-family="system-ui, sans-serif" font-size="11">OLED Minimal Luxury • Neon Emerald Accents</text>
  <rect x="490" y="98" width="70" height="26" rx="13" fill="url(#emeraldGrad)"/>
  <text x="525" y="115" fill="#000000" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ACTIVE</text>

  <!-- Glass Tabs -->
  <rect x="24" y="184" width="80" height="30" rx="8" fill="url(#emeraldGrad)" fill-opacity="0.2" stroke="url(#emeraldGrad)" stroke-width="1"/>
  <text x="64" y="203" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🍣 Nigiri</text>

  <rect x="112" y="184" width="80" height="30" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="152" y="203" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">🍱 Rolls</text>

  <rect x="200" y="184" width="80" height="30" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="240" y="203" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">🥢 Starters</text>

  <!-- Cards -->
  <g transform="translate(24, 230)">
    <rect width="268" height="126" rx="12" fill="#141417" stroke="#27272A" stroke-width="1"/>
    <rect x="12" y="14" width="70" height="70" rx="10" fill="#18181B"/>
    <text x="47" y="58" font-size="32" text-anchor="middle">🍣</text>
    <text x="94" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Otoro Gold Nigiri</text>
    <text x="94" y="52" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Bluefin tuna belly, 24k gold leaf</text>
    <text x="94" y="86" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3,600 DZD</text>
    <rect x="196" y="70" width="60" height="26" rx="8" fill="url(#emeraldGrad)"/>
    <text x="226" y="87" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ Add</text>
  </g>

  <g transform="translate(308, 230)">
    <rect width="268" height="126" rx="12" fill="#141417" stroke="#27272A" stroke-width="1"/>
    <rect x="12" y="14" width="70" height="70" rx="10" fill="#18181B"/>
    <text x="47" y="58" font-size="32" text-anchor="middle">🍱</text>
    <text x="94" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Dragon Unagi Roll</text>
    <text x="94" y="52" fill="#71717A" font-family="system-ui, sans-serif" font-size="10">Smoked freshwater eel, avocado</text>
    <text x="94" y="86" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2,400 DZD</text>
    <rect x="196" y="70" width="60" height="26" rx="8" fill="url(#emeraldGrad)"/>
    <text x="226" y="87" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ Add</text>
