  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgNoir)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="600" height="42" fill="#111113" stroke="#27272A" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.8"/>
  <rect x="180" y="11" width="240" height="20" rx="10" fill="#18181B"/>
  <text x="300" y="25" fill="#71717A" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">noir.dzmenu.com</text>

  <!-- Header Banner -->
  <rect x="24" y="58" width="552" height="110" rx="12" fill="#141417" stroke="#27272A" stroke-width="1"/>
